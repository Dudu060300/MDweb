<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>MDweb</title>

    <!-- Collegamento Manifest PWA -->
    <link rel="manifest" href="manifest.json" />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/style.css" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  </head>

  <body>
    <div class="container">
      <div class="form-container" id="formContainer">

        <!-- LOGIN -->
        <div class="card front">
          <h2>Accedi</h2>
          <input type="text" id="loginEmail" placeholder="Username/Email"
                 autocapitalize="none" autocorrect="off" autocomplete="username" />
          <input type="password" id="loginPassword" placeholder="Password"
                 autocomplete="current-password" />
          <button onclick="login()">Login</button>
          <button class="google" onclick="googleLogin()">Accedi con Google</button>
          <button class="apple" onclick="appleLogin()">Accedi con Apple</button>
          <p>Non hai un account? <a href="#" onclick="flipCard(); return false;">Registrati</a></p>
        </div>

        <!-- REGISTRAZIONE -->
        <div class="card back">
          <h2>Registrati</h2>
          
          <!-- Step 1: Dati e Verifica in tempo reale -->
          <div id="regStep1">
            <input type="text" id="regName" placeholder="Username"
                   autocapitalize="none" autocorrect="off" autocomplete="username" oninput="checkUsernameRealtime()" />
            <small id="usernameFeedback" style="display:block; font-size:0.75rem; margin-bottom:4px;"></small>

            <input type="email" id="regEmail" placeholder="Email" autocomplete="email" oninput="checkEmailRealtime()" />
            <small id="emailFeedback" style="display:block; font-size:0.75rem; margin-bottom:4px;"></small>

            <input type="password" id="regPassword" placeholder="Password"
                   autocomplete="new-password" oninput="checkPasswordRequirements()" />
            
            <!-- Box requisiti password -->
            <div id="passwordReqs" style="font-size:0.75rem; color:#aaa; margin: 4px 0 10px 0; line-height: 1.2;">
              <div id="req-length">❌ Minimo 8 caratteri</div>
              <div id="req-chars">❌ Solo lettere, numeri e simboli standard</div>
            </div>

            <button onclick="sendOtpAndProceed()" id="btnSendOtp">Invia codice OTP via Email</button>
            <p>Hai già un account? <a href="#" onclick="flipCard(); return false;">Accedi</a></p>
          </div>

          <!-- Step 2: Inserimento OTP ricevuto via email -->
          <div id="regStep2" style="display: none;">
            <p style="font-size: 0.9rem; margin-bottom: 15px; text-align: center;">Abbiamo inviato un link/codice di verifica alla tua email. Conferma per completare la registrazione.</p>
            <input type="text" id="otpCode" placeholder="Inserisci OTP (o conferma email)" />
            <button onclick="verifyOtpAndRegister()">Conferma e Registrati</button>
            <button class="google" onclick="backToStep1()" style="background:#555; box-shadow:none;">Indietro</button>
          </div>

        </div>

      </div>
    </div>

    <!-- SCRIPT -->
    <script src="firebase-init.js"></script>
    <script src="auth.js"></script>
  </body>
</html>

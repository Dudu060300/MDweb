    <canvas id="gameCanvas" width="400" height="600"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");

const ctx = canvas.getContext("2d");

// 🚗 Macchina

let car = {

  x: 180,

  y: 500,

  width: 40,

  height: 70,

  speed: 4

};

// 🅿️ Parcheggio (obiettivo)

let parking = {

  x: 150,

  y: 50,

  width: 100,

  height: 80

};

// 🚧 Ostacoli

let obstacles = [

  {x: 100, y: 300, width: 60, height: 30},

  {x: 250, y: 200, width: 60, height: 30}

];

// 🎮 Controlli

let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);

document.addEventListener("keyup", e => keys[e.key] = false);

// 🔄 Update

function update() {

  if (keys["ArrowUp"]) car.y -= car.speed;

  if (keys["ArrowDown"]) car.y += car.speed;

  if (keys["ArrowLeft"]) car.x -= car.speed;

  if (keys["ArrowRight"]) car.x += car.speed;

  // Collisioni con ostacoli

  for (let obs of obstacles) {

    if (

      car.x < obs.x + obs.width &&

      car.x + car.width > obs.x &&

      car.y < obs.y + obs.height &&

      car.y + car.height > obs.y

    ) {

      alert("💥 Hai colpito un ostacolo!");

      resetGame();

    }

  }

  // Vittoria

  if (

    car.x < parking.x + parking.width &&

    car.x + car.width > parking.x &&

    car.y < parking.y + parking.height &&

    car.y + car.height > parking.y

  ) {

    alert("🎉 Parcheggio completato!");

    resetGame();

  }

}

// 🔁 Reset

function resetGame() {

  car.x = 180;

  car.y = 500;

}

// 🎨 Disegno

function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Parcheggio

  ctx.fillStyle = "green";

  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  // Ostacoli

  ctx.fillStyle = "red";

  for (let obs of obstacles) {

    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

  }

  // Macchina

  ctx.fillStyle = "blue";

  ctx.fillRect(car.x, car.y, car.width, car.height);

}

// 🔁 Loop

function gameLoop() {

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>
    
  </body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">
</head>

<body>

<nav>
  <h1>MDweb</h1>
</nav>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.tabIndex = 1;
canvas.focus();

// 🚗 CAR
let car = {
  x: 200,
  y: 500,
  width: 30,
  height: 50,
  angle: 0,
  speed: 0
};

// ⌨️ INPUT
let keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

// 🖼️ CAR IMAGE
let carImg = new Image();
carImg.src = "assets/Top-Down-Car-Conceptual-Model-Display-PNG.png";

// 🅿️ PARKING
let parking = { x: 160, y: 50, width: 80, height: 120 };

// 🎮 CONTROLLI
let steering = 0;
let gasPressed = false;
let brakePressed = false;
let isGameOver = false;

function setGas(v){ gasPressed = v; }
function setBrake(v){ brakePressed = v; }

// 🎮 SETUP CONTROLLI
function setupControls() {

  const wheel = document.getElementById("wheel");

  let dragging = false;
  let lastX = 0;

  wheel.addEventListener("mousedown", e => {
    dragging = true;
    lastX = e.clientX;
  });

  window.addEventListener("mouseup", () => dragging = false);

  window.addEventListener("mousemove", e => {
    if (!dragging) return;

    let delta = e.clientX - lastX;
    lastX = e.clientX;

    steering += delta * 0.002;
    steering = Math.max(-1, Math.min(1, steering));

    wheel.style.transform = `rotate(${steering * 120}deg)`;
  });

  const gas = document.getElementById("gas");
  const brake = document.getElementById("brake");

  gas.addEventListener("mousedown", () => setGas(true));
  gas.addEventListener("mouseup", () => setGas(false));
  gas.addEventListener("touchstart", () => setGas(true));
  gas.addEventListener("touchend", () => setGas(false));

  brake.addEventListener("mousedown", () => setBrake(true));
  brake.addEventListener("mouseup", () => setBrake(false));
  brake.addEventListener("touchstart", () => setBrake(true));
  brake.addEventListener("touchend", () => setBrake(false));
}

// 💥 GAME OVER
function gameOver(){
  if (isGameOver) return;
  isGameOver = true;
  alert("💥 HAI PERSO!");
  reset();
}

// 🔄 RESET
function reset(){
  car.x = 200;
  car.y = 500;
  car.speed = 0;
  car.angle = 0;
  steering = 0;
  isGameOver = false;
}

// 🧱 BORDERS
function checkBorders(){
  if (
    car.x < 0 ||
    car.x > canvas.width ||
    car.y < 0 ||
    car.y > canvas.height
  ) gameOver();
}

// 🚗 UPDATE
function update(){

  if (isGameOver) return;

  if (gasPressed || keys["ArrowUp"]) car.speed += 0.2;
  if (brakePressed || keys["ArrowDown"]) car.speed -= 0.3;

  car.angle += steering * 0.03;
  steering *= 0.9;

  car.speed *= 0.98;

  car.x += Math.sin(car.angle) * car.speed;
  car.y -= Math.cos(car.angle) * car.speed;

  checkBorders();

  // 🅿️ WIN
  if (
    car.x > parking.x &&
    car.x < parking.x + parking.width &&
    car.y > parking.y &&
    car.y < parking.y + parking.height
  ){
    alert("🎉 PARCHEGGIATO!");
    reset();
  }
}

// 🎨 DRAW
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // parcheggio
  ctx.fillStyle = "green";
  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  // auto
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);
  ctx.drawImage(carImg, -15, -25, car.width, car.height);
  ctx.restore();

  if (isGameOver){
    ctx.fillStyle = "red";
    ctx.font = "30px Arial";
    ctx.fillText("GAME OVER", 90, 300);
  }
}

// LOOP
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

carImg.onload = () => {
  setupControls();
  loop();
};
</script>

<!-- 🎮 CONTROLLI -->
<div class="controls">

  <div class="steering-wheel" id="wheel">🚗</div>

  <div class="pedals">
    <button class="gas" id="gas">ACCELERA</button>
    <button class="brake" id="brake">FRENO</button>
  </div>

</div>

</body>
</html>

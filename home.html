    <canvas id="gameCanvas" width="400" height="600"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");

const ctx = canvas.getContext("2d");

canvas.tabIndex = 1;

canvas.focus();

canvas.addEventListener("click", () => canvas.focus());

// 🚗 macchina

let car = {

  x: 200,

  y: 500,

  width: 30,

  height: 50,

  angle: 0,

  speed: 0

};

let keys = {};

window.addEventListener("keydown", (e) => keys[e.key] = true);

window.addEventListener("keyup", (e) => keys[e.key] = false);

let carImg = new Image();

carImg.src = "assets/Top-Down-Car-Conceptual-Model-Display-PNG.png";

// 🅿️ parcheggio

let parking = {

  x: 160,

  y: 50,

  width: 80,

  height: 120

};

function update() {

  // accelerazione

  if (keys["ArrowUp"]) {

    car.speed += 0.2;

  }

  if (keys["ArrowDown"]) {

    car.speed -= 0.2;

  }

  // sterzo

  if (keys["ArrowLeft"]) {

    car.angle -= 0.05;

  }

  if (keys["ArrowRight"]) {

    car.angle += 0.05;

  }

  // attrito

  car.speed *= 0.98;

  // movimento realistico

  car.x += Math.sin(car.angle) * car.speed;

  car.y -= Math.cos(car.angle) * car.speed;

  // collisione parcheggio

  if (

    car.x > parking.x &&

    car.x < parking.x + parking.width &&

    car.y > parking.y &&

    car.y < parking.y + parking.height

  ) {

    alert("🎉 PARCHEGGIATO!");

    reset();

  }

}

function reset() {

  car.x = 200;

  car.y = 500;

  car.speed = 0;

  car.angle = 0;

}

function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // parcheggio

  ctx.fillStyle = "green";

  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  // macchina

  ctx.save();

  ctx.translate(car.x, car.y);

  ctx.rotate(car.angle);

  ctx.drawImage(carImg, -15, -25, car.width, car.height);

  ctx.fillRect(-15, -25, car.width, car.height);

  ctx.restore();

}

function loop() {

  update();

  draw();

  requestAnimationFrame(loop);

}

loop();

</script>

<div class="controls">

  <button onclick="keys['ArrowUp']=true; setTimeout(()=>keys['ArrowUp']=false,100)">⬆️</button>

  <div>

    <button onclick="keys['ArrowLeft']=true; setTimeout(()=>keys['ArrowLeft']=false,100)">⬅️</button>

    <button onclick="keys['ArrowDown']=true; setTimeout(()=>keys['ArrowDown']=false,100)">⬇️</button>

    <button onclick="keys['ArrowRight']=true; setTimeout(()=>keys['ArrowRight']=false,100)">➡️</button>

  </div>

</div>
    
  </body>

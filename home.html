<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDweb</title>

  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">
</head>

<body>

<div id="overlay" class="hidden"></div>

<nav>
  <h1>MDweb</h1>

  <div class="user-menu" id="userMenu">
    <div class="user-icon" id="userIcon">U</div>
    <span class="arrow">&#9662;</span>

    <div class="dropdown">
      <span id="userName">Utente</span>
      <a href="profilo.html">Profilo</a>
      <a href="impostazioni.html">Impostazioni</a>
      <a href="#" id="logout">Logout</a>
    </div>
  </div>
</nav>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<div class="controls">

  <div class="steering-wheel" id="wheel">
    <img src="assets/Steering-Wheel.png" draggable="false">
  </div>

  <div class="pedals">
    <button id="gas">GAS</button>
    <button id="brake">FRENO</button>
  </div>

  <!-- CAMBIO P D R -->
  <div class="gear-selector">

    <div class="gear-track"></div>

    <div class="gear-item" onclick="setGear('P')" id="gearPBox">
      <span class="gear-label">P</span>
    </div>

    <div class="gear-item" onclick="setGear('D')" id="gearDBox">
      <span class="gear-label">D</span>
    </div>

    <div class="gear-item" onclick="setGear('R')" id="gearRBox">
      <span class="gear-label">R</span>
    </div>

    <div class="gear-indicator" id="gearIndicator"></div>

  </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 🚗 AUTO
let car = {
  x: 200,
  y: 500,
  angle: 0,
  speed: 0
};

// 🅿️ PARCHEGGIO
let parking = {
  x: 160,
  y: 50,
  width: 80,
  height: 120
};

// 🎮 INPUT
let gasPressed = false;
let brakePressed = false;

let steeringAngle = 0;
let steeringInput = 0;

let gear = "D";

// 🚗 IMMAGINE AUTO
let carImg = new Image();
carImg.src = "assets/Top-Down-Car-Conceptual-Model-Display-PNG.png";

/* ================= CAMBIO ================= */
function setGear(g) {

  if (g === "P") {
    let inside =
      car.x > parking.x &&
      car.x < parking.x + parking.width &&
      car.y > parking.y &&
      car.y < parking.y + parking.height;

    if (!inside) {
      alert("⚠️ Devi essere nel parcheggio per mettere P!");
      return;
    }
  }

  gear = g;

  const indicator = document.getElementById("gearIndicator");
  const target = document.getElementById("gear" + g + "Box");

  indicator.style.top = target.offsetTop + "px";
}

/* ================= CONTROLLI ================= */
function setupControls() {

  const wheel = document.getElementById("wheel");
  const img = wheel.querySelector("img");

  let dragging = false;
  let cx = 0, cy = 0;
  let last = 0;

  function getAngle(e) {
    return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
  }

  wheel.addEventListener("pointerdown", (e) => {
    dragging = true;
    wheel.setPointerCapture(e.pointerId);

    const r = wheel.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;

    last = getAngle(e);
  });

  wheel.addEventListener("pointermove", (e) => {
    if (!dragging) return;

    let current = getAngle(e);
    let delta = current - last;

    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    steeringAngle += delta * 2;
    steeringAngle = Math.max(-450, Math.min(450, steeringAngle));

    steeringInput = steeringAngle / 450;

    img.style.transform = `rotate(${steeringAngle}deg)`;

    last = current;
  });

  wheel.addEventListener("pointerup", () => dragging = false);
  wheel.addEventListener("pointercancel", () => dragging = false);

  document.getElementById("gas").addEventListener("pointerdown", () => gasPressed = true);
  document.getElementById("gas").addEventListener("pointerup", () => gasPressed = false);

  document.getElementById("brake").addEventListener("pointerdown", () => brakePressed = true);
  document.getElementById("brake").addEventListener("pointerup", () => brakePressed = false);
}

/* ================= FISICA (🔥 MIGLIORATA) ================= */
function update() {

  if (gear !== "P") {

    // 🔥 ACCELERAZIONE PRECISA
    if (gasPressed) {
      if (gear === "D") car.speed += 0.12;
      if (gear === "R") car.speed -= 0.12;
    } else {
      // 🔥 stop immediato + rolling realistico
      car.speed *= 0.85;
    }

    // freno
    if (brakePressed) {
      car.speed *= 0.80;
    }

  } else {
    car.speed *= 0.8;
  }

  // attrito strada
  car.speed *= 0.92;

  let dir = (gear === "R") ? -1 : 1;

  if (Math.abs(car.speed) > 0.1) {
    car.angle += steeringInput * 0.04;
  }

  car.x += Math.cos(car.angle) * car.speed * dir;
  car.y += Math.sin(car.angle) * car.speed * dir;

  // 🅿️ WIN
  let inside =
    car.x > parking.x &&
    car.x < parking.x + parking.width &&
    car.y > parking.y &&
    car.y < parking.y + parking.height;

  if (inside && gear === "P" && Math.abs(car.speed) < 0.2) {
    alert("🎉 PARCHEGGIO PERFETTO!");
    reset();
  }

  // 💥 BORDI
  if (
    car.x < 0 || car.x > canvas.width ||
    car.y < 0 || car.y > canvas.height
  ) {
    alert("💥 HAI SBAGLIATO!");
    reset();
  }
}

/* ================= RESET ================= */
function reset() {
  car.x = 200;
  car.y = 500;
  car.speed = 0;
  car.angle = 0;

  steeringAngle = 0;
  steeringInput = 0;

  setGear("D");
}

/* ================= DRAW ================= */
function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "green";
  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  if (carImg.complete) {
    ctx.drawImage(carImg, -40, -60, 80, 120);
  } else {
    ctx.fillStyle = "red";
    ctx.fillRect(-40, -60, 80, 120);
  }

  ctx.restore();
}

/* ================= LOOP ================= */
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

setupControls();
setGear("D");
loop();

</script>

</body>
</html>

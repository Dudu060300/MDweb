<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDweb - Parking Game</title>

  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav>
  <h1>MDweb</h1>

  <div class="user-menu" id="userMenu">

    <div class="user-icon" id="userIcon">U</div>
    <span class="arrow">▼</span>

    <div class="dropdown">
      <span id="userName">Utente</span>
      <a href="profilo.html">Profilo</a>
      <a href="impostazioni.html">Impostazioni</a>
      <a href="#" id="logout">Logout</a>
    </div>

  </div>
</nav>

<!-- ================= GAME ================= -->
<canvas id="gameCanvas" width="400" height="600"></canvas>

<!-- ================= CONTROLLI ================= -->
<div class="controls">

  <!-- VOLANTE -->
  <div class="steering-wheel" id="wheel">
    <img src="assets/Steering-Wheel.png" draggable="false">
  </div>

  <!-- PEDALI -->
  <div class="pedals">
    <button id="gas" class="gas">GAS</button>
    <button id="brake" class="brake">FRENO</button>
  </div>

</div>

<!-- ================= FIREBASE ================= -->
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>

<!-- ================= SCRIPT UTENTE ================= -->
<script src="assets/scriptHome.js"></script>

<!-- ================= GIOCO ================= -->
<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ================= AUTO =================
let car = {
  x: 200,
  y: 500,
  width: 80,
  height: 120,
  angle: 0,
  speed: 0
};

// ================= PARCHEGGIO =================
let parking = {
  x: 160,
  y: 50,
  width: 80,
  height: 120
};

// ================= INPUT =================
let gasPressed = false;
let brakePressed = false;

let steeringAngle = 0;
let steeringInput = 0;
let gameOverFlag = false;

// ================= IMAGE =================
let carImg = new Image();
carImg.src = "assets/Top-Down-Car-Conceptual-Model-Display-PNG.png";

// ================= CONTROLLI =================
function setupControls() {

  const wheel = document.getElementById("wheel");
  const wheelImg = wheel.querySelector("img");

  let dragging = false;
  let centerX = 0;

  wheel.addEventListener("pointerdown", (e) => {
    dragging = true;
    wheel.setPointerCapture(e.pointerId);

    const rect = wheel.getBoundingClientRect();
    centerX = rect.left + rect.width / 2;
  });

  wheel.addEventListener("pointermove", (e) => {
    if (!dragging) return;

    let dx = e.clientX - centerX;

    let target = dx * 1.3;

    steeringAngle += (target - steeringAngle) * 0.25;

    steeringAngle = Math.max(-450, Math.min(450, steeringAngle));

    steeringInput = steeringAngle / 450;

    wheelImg.style.transform = `rotate(${steeringAngle}deg)`;
  });

  wheel.addEventListener("pointerup", () => dragging = false);
  wheel.addEventListener("pointercancel", () => dragging = false);

  // GAS
  const gas = document.getElementById("gas");
  gas.addEventListener("pointerdown", () => gasPressed = true);
  gas.addEventListener("pointerup", () => gasPressed = false);
  gas.addEventListener("pointercancel", () => gasPressed = false);

  // FRENO
  const brake = document.getElementById("brake");
  brake.addEventListener("pointerdown", () => brakePressed = true);
  brake.addEventListener("pointerup", () => brakePressed = false);
  brake.addEventListener("pointercancel", () => brakePressed = false);
}

// ================= UPDATE =================
function update() {

  if (gameOverFlag) return;

  if (gasPressed) car.speed += 0.18;
  if (brakePressed) car.speed -= 0.25;

  if (Math.abs(car.speed) > 0.1) {
    car.angle += steeringInput * 0.04;
  }

  car.speed *= 0.97;

  car.x += Math.sin(car.angle) * car.speed;
  car.y -= Math.cos(car.angle) * car.speed;

  if (
    car.x < 0 || car.x > canvas.width ||
    car.y < 0 || car.y > canvas.height
  ) {
    gameOver();
  }

  checkWin();
}

// ================= WIN =================
function checkWin() {

  let inside =
    car.x > parking.x &&
    car.x < parking.x + parking.width &&
    car.y > parking.y &&
    car.y < parking.y + parking.height;

  if (inside && Math.abs(car.speed) < 0.25) {
    alert("🎉 PARCHEGGIO PERFETTO!");
    reset();
  }
}

// ================= GAME OVER =================
function gameOver() {
  gameOverFlag = true;
  alert("💥 HAI PERSO!");
  reset();
}

// ================= RESET =================
function reset() {
  car.x = 200;
  car.y = 500;
  car.speed = 0;
  car.angle = 0;

  steeringAngle = 0;
  steeringInput = 0;

  gameOverFlag = false;
}

// ================= DRAW =================
function draw() {

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "green";
  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);
  ctx.drawImage(carImg, -car.width/2, -car.height/2, car.width, car.height);
  ctx.restore();
}

// ================= LOOP =================
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

carImg.onload = () => {
  setupControls();
  loop();
};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Cristian: più e meno - MDweb</title>

  <!-- Fogli di stile CSS globali del sito -->
  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">

  <!-- Script di blocco gesti di zoom -->
  <script>
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      const now = (new Date()).getTime();
      if (now - lastTouchEnd <= 300) {
        e.preventDefault();
      }
      lastTouchEnd = now;
    }, false);
  </script>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

  <!-- Inizializzazione Firebase e protezione pagina -->
  <script src="firebase-init.js"></script>
  <script src="auth-guard.js"></script>
</head>

<body>

  <div id="overlay" class="hidden"></div>

  <!-- BARRA DI NAVIGAZIONE -->
  <nav>
    <h1>MDweb</h1>
    <div
      class="user-menu"
      id="userMenu"
      tabindex="0"
      aria-haspopup="true"
      aria-expanded="false"
      aria-label="Menu utente"
    >
      <div class="user-icon" id="userIcon" aria-hidden="true">U</div>
      <span class="arrow" aria-hidden="true">&#9662;</span>

      <div
        class="dropdown"
        id="dropdownMenu"
        role="menu"
        aria-label="Menu opzioni utente"
      >
        <span class="dropdown-item username-display" id="userName">Utente</span>
        <a href="profilo.html" id="editProfile" role="menuitem" tabindex="-1">Modifica profilo</a>
        <a href="impostazioni.html" id="openSettings" role="menuitem" tabindex="-1">Impostazioni</a>
        <a href="#" id="logout" role="menuitem" tabindex="-1">Logout</a>
      </div>
    </div>
  </nav>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="cristian-main">
    <h1>Cristian</h1>
    <p class="sub">Tocca + o − ogni volta. Indica il motivo.</p>

    <!-- Sezione riepilogo del saldo -->
    <section class="balance" aria-live="polite">
      <div class="num" id="bal">0</div>
      <div class="lbl" id="verdict">Ancora nessun punto</div>
      <div class="bar">
        <i class="p" id="bp" style="width:0"></i>
        <i class="n" id="bn" style="width:0"></i>
      </div>
    </section>

    <!-- Casella di input per il motivo e selezione foto -->
    <div class="note-container">
      <input class="note" id="note" type="text" maxlength="80" placeholder="Motivo" aria-label="Motivo">
      
      <!-- Contenitore per allegare la foto -->
      <div class="photo-upload-container">
        <label for="photoInput" class="photo-btn">📷 Aggiungi foto</label>
        <input type="file" id="photoInput" accept="image/*" class="hidden" style="display: none !important;">
        <span id="photoName" class="photo-name"></span>
        <button type="button" id="removePhotoBtn" class="remove-photo-btn hidden" aria-label="Rimuovi foto">✕</button>
      </div>
    </div>

    <!-- Pulsanti principali (+) e (-) -->
    <div class="btns">
      <button id="plus" type="button" aria-label="Aggiungi un più">
        <span class="sym">+</span>
        <span class="cnt" id="cp">0 positivi</span>
      </button>
      <button id="minus" type="button" aria-label="Aggiungi un meno">
        <span class="sym">−</span>
        <span class="cnt" id="cn">0 negativi</span>
      </button>
    </div>

    <!-- Strumenti posizionati sopra lo storico -->
    <div class="tools">
      <button id="undo" type="button">Annulla ultimo</button>
      <button id="reset" type="button">Azzera tutto</button>
    </div>

    <!-- Sezione dello storico -->
    <h2>Storico</h2>
    <ul id="log"></ul>
    <p class="empty" id="empty">Niente da mostrare.</p>
  </main>

  <!-- MODALE ANTEPRIMA FOTO A SCHERMO INTERO -->
  <div id="photoModal" class="photo-modal hidden" role="dialog" aria-modal="true" aria-label="Anteprima foto">
    <!-- Freccia per tornare indietro in alto a sinistra -->
    <button type="button" id="closePhotoModal" class="modal-back-btn" aria-label="Torna indietro">
      &#8592;
    </button>
    
    <!-- Immagine a schermo intero -->
    <img id="modalImage" class="photo-modal-img" src="" alt="Anteprima immagine">
    
    <!-- Dissolvenza sfumata in basso con il motivo -->
    <div id="modalFadeOverlay" class="photo-modal-fade">
      <p id="modalCaption" class="photo-modal-caption"></p>
    </div>
  </div>

  <!-- SCRIPT ESTERNI DEL SITO -->
  <script src="assets/tema.js"></script>
  <script src="assets/scriptHome.js"></script>
  <script src="assets/scriptCristian.js"></script>

</body>
</html>

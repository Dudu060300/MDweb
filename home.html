<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Cristian: più e meno - MDweb</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">

  <style>
    /* Stili ad alto contrasto e gestione tema scuro/chiaro nativo */
    :root {
      --pos: #047857; --pos-bg: #d1fae5; --pos-card: #ecfdf5;
      --neg: #be123c; --neg-bg: #ffe4e6; --neg-card: #fff1f2;
      --card-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --pos: #34d399; --pos-bg: #064e3b; --pos-card: #022c22;
        --neg: #fb7185; --neg-bg: #4c0519; --neg-card: #3f030f;
        --card-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.4);
      }
    }

    :root[data-theme="dark"] {
      --pos: #34d399; --pos-bg: #064e3b; --pos-card: #022c22;
      --neg: #fb7185; --neg-bg: #4c0519; --neg-card: #3f030f;
      --card-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.4);
    }

    body {
      background: var(--bg);
      background-attachment: fixed;
    }

    main.cristian-main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    main.cristian-main h1 {
      font-size: 2.2rem;
      margin: 4px 0 2px;
      letter-spacing: -.7px;
      font-weight: 800;
      color: var(--text);
    }

    .sub {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    /* Card del saldo con alto contrasto */
    .balance {
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 24px;
      text-align: center;
      box-shadow: var(--card-shadow);
    }

    .balance .num {
      font-size: 4rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
    }

    .balance .lbl {
      color: var(--text);
      opacity: 0.8;
      margin-top: 8px;
      font-weight: 700;
      font-size: 1rem;
    }

    .bar {
      display: flex;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--line);
      margin-top: 18px;
      border: 1px solid var(--line);
    }

    .bar i {
      display: block;
      transition: width .4s ease;
    }

    .bar .p { background: var(--pos); }
    .bar .n { background: var(--neg); }

    /* Input motivo ad alto contrasto */
    .note-container {
      margin: 18px 0;
    }

    .note {
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      border: 2px solid var(--line);
      background-color: var(--surface) !important;
      color: var(--text) !important;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      box-shadow: var(--card-shadow);
      transition: border-color 0.2s ease;
    }

    .note:focus {
      border-color: var(--text);
    }

    .note::placeholder {
      color: var(--muted);
      font-weight: 400;
    }

    /* Pulsanti principali Più e Meno */
    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .btns button {
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 22px 12px;
      font: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      box-shadow: var(--card-shadow);
      transition: transform 0.15s ease;
    }

    .btns button:active {
      transform: scale(0.95);
    }

    .btns .sym {
      font-size: 3.2rem;
      font-weight: 900;
      line-height: 1;
    }

    .btns .cnt {
      font-size: 1.05rem;
      font-weight: 800;
    }

    #plus { background: var(--pos-bg); color: var(--pos); border-color: var(--pos); }
    #minus { background: var(--neg-bg); color: var(--neg); border-color: var(--neg); }

    /* Pulsanti strumenti (Annulla / Azzera) spostati SOPRA lo storico */
    .tools {
      display: flex;
      gap: 12px;
      margin: 16px 0 24px 0;
    }

    .tools button {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: 2px solid var(--line) !important;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .tools button:hover {
      background: var(--line);
      border-color: var(--text) !important;
    }

    main.cristian-main h2 {
      font-size: 1.2rem;
      margin: 16px 0 12px;
      font-weight: 800;
      color: var(--text);
    }

    main.cristian-main ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    main.cristian-main li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 10px;
      box-shadow: var(--card-shadow);
    }

    /* Intestazione del giorno nello storico */
    li.day-header {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      font-weight: 800;
      color: var(--muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 20px;
      margin-bottom: 8px;
      padding: 0 4px !important;
    }

    main.cristian-main li .tag {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.1rem;
    }

    li.p .tag { background: var(--pos-bg); color: var(--pos); border: 2px solid var(--pos); }
    li.n .tag { background: var(--neg-bg); color: var(--neg); border: 2px solid var(--neg); }

    li .txt {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    li .time {
      color: var(--muted);
      font-size: 0.85rem;
      flex: none;
      font-weight: 700;
    }

    .empty {
      color: var(--muted);
      padding: 16px 0;
      text-align: center;
      font-style: italic;
      font-weight: 500;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

  <!-- Configurazione + protezione della pagina -->
  <script src="firebase-init.js"></script>
  <script src="auth-guard.js"></script>
</head>

<body>

  <div id="overlay" class="hidden"></div>

  <!-- NAV BAR -->
  <nav>
    <h1>MDweb</h1>
    <div
      class="user-menu"
      id="userMenu"
      tabindex="0"
      aria-haspopup="true"
      aria-expanded="false"
      aria-label="Menu utente"
    >
      <div class="user-icon" id="userIcon" aria-hidden="true">U</div>
      <span class="arrow" aria-hidden="true">&#9662;</span>

      <div
        class="dropdown"
        id="dropdownMenu"
        role="menu"
        aria-label="Menu opzioni utente"
      >
        <span class="dropdown-item username-display" id="userName">Utente</span>
        <a href="profilo.html" id="editProfile" role="menuitem" tabindex="-1">Modifica profilo</a>
        <a href="impostazioni.html" id="openSettings" role="menuitem" tabindex="-1">Impostazioni</a>
        <a href="#" id="logout" role="menuitem" tabindex="-1" onclick="logout(); return false;">Logout</a>
      </div>
    </div>
  </nav>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="cristian-main">
    <h1>Cristian</h1>
    <p class="sub">Tocca + o − ogni volta. Se vuoi, scrivi il motivo.</p>

    <section class="balance" aria-live="polite">
      <div class="num" id="bal">0</div>
      <div class="lbl" id="verdict">Ancora nessun punto</div>
      <div class="bar">
        <i class="p" id="bp" style="width:0"></i>
        <i class="n" id="bn" style="width:0"></i>
      </div>
    </section>

    <div class="note-container">
      <input class="note" id="note" type="text" maxlength="80" placeholder="Motivo (facoltativo)" aria-label="Motivo">
    </div>

    <div class="btns">
      <button id="plus" type="button" aria-label="Aggiungi un più">
        <span class="sym">+</span>
        <span class="cnt" id="cp">0 positivi</span>
      </button>
      <button id="minus" type="button" aria-label="Aggiungi un meno">
        <span class="sym">−</span>
        <span class="cnt" id="cn">0 negativi</span>
      </button>
    </div>

    <!-- STRUMENTI SPOSTATI SOPRA LO STORICO -->
    <div class="tools">
      <button id="undo" type="button">Annulla ultimo</button>
      <button id="reset" type="button">Azzera tutto</button>
    </div>

    <h2>Storico</h2>
    <ul id="log"></ul>
    <p class="empty" id="empty">Niente da mostrare. Premi + o − per iniziare.</p>
  </main>

  <!-- SCRIPT DEL SITO -->
  <script src="assets/tema.js"></script>
  <script src="assets/scriptHome.js"></script>

  <!-- LOGICA DEL SISTEMA PIÙ E MENO -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      let items = [];
      let db, userId;

      const $ = function(id) { return document.getElementById(id); };
      function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

      function render() {
        var p = items.filter(function(i) { return i.t === "p"; }).length,
            n = items.length - p,
            b = p - n;
        
        if ($("bal")) {
          $("bal").textContent = (b > 0 ? "+" : b < 0 ? "−" : "") + Math.abs(b);
          $("bal").style.color = b > 0 ? "var(--pos)" : b < 0 ? "var(--neg)" : "var(--text)";
        }
        if ($("verdict")) {
          $("verdict").textContent = !items.length ? "Ancora nessun punto" : b > 0 ? "Meglio i pregi dei difetti" : b < 0 ? "I difetti vincono" : "Pareggio perfetto";
        }
        if ($("cp")) $("cp").textContent = p + (p === 1 ? " positivo" : " positivi");
        if ($("cn")) $("cn").textContent = n + (n === 1 ? " negativo" : " negativi");
        
        var tot = items.length || 1;
        if ($("bp")) $("bp").style.width = (p / tot * 100) + "%";
        if ($("bn")) $("bn").style.width = (n / tot * 100) + "%";
        if ($("empty")) $("empty").style.display = items.length ? "none" : "block";
        
        if ($("log")) {
          let lastDayStr = "";
          let html = "";
          
          items.slice().reverse().forEach(function(i) {
            var d = new Date(i.d);
            var dayStr = d.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
            
            if (dayStr !== lastDayStr) {
              lastDayStr = dayStr;
              html += '<li class="day-header">' + dayStr + '</li>';
            }
            
            var h = d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
            html += '<li class="' + i.t + '"><span class="tag">' + (i.t === "p" ? "+" : "−") + '</span><span class="txt">' + (i.n ? esc(i.n) : '<span style="color:var(--muted)">senza motivo</span>') + '</span><span class="time">' + h + '</span></li>';
          });
          
          $("log").innerHTML = html;
        }
      }

      async function saveToFirestore() {
        if (!db || !userId) return;
        try {
          await db.collection("users").doc(userId).collection("data").doc("cristian_score").set({ items });
        } catch (e) {
          console.error("Errore salvataggio Firestore:", e);
        }
      }

      async function initFirestore() {
        try {
          db = firebase.firestore();
          firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
              userId = user.uid;
              try {
                const docRef = await db.collection("users").doc(userId).collection("data").doc("cristian_score").get();
                if (docRef.exists) {
                  items = docRef.data().items || [];
                } else {
                  const oldData = localStorage.getItem("cristian-score");
                  if (oldData) {
                    items = JSON.parse(oldData) || [];
                    await saveToFirestore();
                  }
                }
              } catch (err) {
                console.error("Errore lettura dati utente:", err);
              }
              render();
            }
          });
        } catch (e) {
          console.error("Errore Firebase:", e);
        }
      }

      function add(t) {
        const noteEl = $("note");
        const val = noteEl ? noteEl.value.trim() : "";
        items.push({ t: t, n: val, d: Date.now() });
        if (noteEl) noteEl.value = "";
        saveToFirestore();
        render();
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
      }

      if ($("plus")) $("plus").onclick = function() { add("p"); };
      if ($("minus")) $("minus").onclick = function() { add("n"); };
      
      if ($("note")) {
        $("note").addEventListener("keydown", function(e) { 
          if (e.key === "Enter") { add("p"); } 
        });
      }
      
      /* Avviso di conferma per Annulla ultimo */
      if ($("undo")) {
        $("undo").onclick = function() {
          if (items.length) {
            if (confirm("Sei sicuro di voler annullare l'ultimo inserimento?")) {
              items.pop();
              saveToFirestore();
              render();
            }
          } else {
            alert("Non ci sono elementi da annullare.");
          }
        };
      }
      
      /* Avviso di conferma per Azzera tutto */
      if ($("reset")) {
        $("reset").onclick = function() {
          if (items.length) {
            if (confirm("ATTENZIONE: Sei sicuro di voler azzerare tutti i punti e lo storico di Cristian?")) {
              items = [];
              saveToFirestore();
              render();
            }
          } else {
            alert("Il registro è già vuoto.");
          }
        };
      }

      render();
      initFirestore();
    });
  </script>

</body>
</html>

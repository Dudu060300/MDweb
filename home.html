<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>

  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">
</head>

<body>

<div id="overlay" class="hidden"></div>

<!-- ================= NAV BAR (TUO CODICE) ================= -->
<nav>
  <h1>MDweb</h1>

  <div class="user-menu" id="userMenu">
    <div class="user-icon" id="userIcon">U</div>
    <span class="arrow">&#9662;</span>

    <div class="dropdown" id="dropdownMenu">
      <span class="dropdown-item username-display" id="userName">Utente</span>
      <a href="profilo.html">Modifica profilo</a>
      <a href="impostazioni.html">Impostazioni</a>
      <a href="" id="logout">Logout</a>
    </div>
  </div>
</nav>

<!-- ================= CANVAS GIOCO ================= -->
<canvas id="gameCanvas" width="400" height="600"></canvas>

<!-- ================= CONTROLLI GIOCO ================= -->
<div class="controls">

  <div class="steering-wheel" id="wheel">
    <img src="assets/Steering-Wheel.png" />
  </div>

  <div class="pedals">
    <button class="gas" id="gas">ACCELERA</button>
    <button class="brake" id="brake">FRENO</button>
  </div>

</div>

<!-- ================= FIREBASE (TUO CODICE) ================= -->
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

<script src="assets/tema.js"></script>
<script src="assets/scriptHome.js"></script>

<!-- ================= GIOCO ================= -->
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 🚗 CAR
let car = {
  x: 200,
  y: 500,
  width: 30,
  height: 50,
  angle: 0,
  speed: 0
};

// 🅿️ PARKING
let parking = { x: 160, y: 50, width: 80, height: 120 };

// INPUT
let gasPressed = false;
let brakePressed = false;

let steeringAngle = 0;
let steeringInput = 0;
let isGameOver = false;

// 🖼️ AUTO
let carImg = new Image();
carImg.src = "assets/Top-Down-Car-Conceptual-Model-Display-PNG.png";

// ================= CONTROLLI =================
function setGas(v){ gasPressed = v; }
function setBrake(v){ brakePressed = v; }

function setupControls() {

  const wheel = document.getElementById("wheel");
  const wheelImg = wheel.querySelector("img");

  let dragging = false;
  let lastX = 0;

  function start(x){
    dragging = true;
    lastX = x;
  }

  function move(x){
    if (!dragging) return;

    let delta = x - lastX;
    lastX = x;

    steeringAngle += delta * 1.2;
    steeringAngle = Math.max(-450, Math.min(450, steeringAngle));

    steeringInput = steeringAngle / 450;

    wheelImg.style.transform = `rotate(${steeringAngle}deg)`;
  }

  function end(){
    dragging = false;
  }

  wheel.addEventListener("mousedown", e => start(e.clientX));
  window.addEventListener("mousemove", e => move(e.clientX));
  window.addEventListener("mouseup", end);

  wheel.addEventListener("touchstart", e => start(e.touches[0].clientX));
  window.addEventListener("touchmove", e => move(e.touches[0].clientX));
  window.addEventListener("touchend", end);

  const gas = document.getElementById("gas");
  const brake = document.getElementById("brake");

  gas.addEventListener("mousedown", () => setGas(true));
  gas.addEventListener("mouseup", () => setGas(false));
  gas.addEventListener("touchstart", () => setGas(true));
  gas.addEventListener("touchend", () => setGas(false));

  brake.addEventListener("mousedown", () => setBrake(true));
  brake.addEventListener("mouseup", () => setBrake(false));
  brake.addEventListener("touchstart", () => setBrake(true));
  brake.addEventListener("touchend", () => setBrake(false));
}

// ================= GAME =================
function gameOver(){
  if (isGameOver) return;
  isGameOver = true;
  alert("💥 HAI PERSO!");
  reset();
}

function reset(){
  car.x = 200;
  car.y = 500;
  car.speed = 0;
  car.angle = 0;
  steeringAngle = 0;
  steeringInput = 0;
  isGameOver = false;
}

function checkBorders(){
  if (
    car.x < 0 ||
    car.x > canvas.width ||
    car.y < 0 ||
    car.y > canvas.height
  ) gameOver();
}

function checkWin(){

  let cx = parking.x + parking.width / 2;
  let cy = parking.y + parking.height / 2;

  let dx = car.x - cx;
  let dy = car.y - cy;

  let dist = Math.sqrt(dx*dx + dy*dy);

  let okPos = dist < 22;
  let okAngle = Math.abs(car.angle % Math.PI) < 0.25;
  let okSpeed = Math.abs(car.speed) < 0.4;

  if (okPos && okAngle && okSpeed){
    alert("🎉 PARCHEGGIO PERFETTO!");
    reset();
  }
}

function update(){

  if (isGameOver) return;

  if (gasPressed) car.speed += 0.2;
  if (brakePressed) car.speed -= 0.3;

  car.angle += steeringInput * 0.04;

  steeringAngle *= 0.97;
  steeringInput = steeringAngle / 450;

  car.speed *= 0.98;

  car.x += Math.sin(car.angle) * car.speed;
  car.y -= Math.cos(car.angle) * car.speed;

  checkBorders();
  checkWin();
}

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "green";
  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);
  ctx.drawImage(carImg, -15, -25, car.width, car.height);
  ctx.restore();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

carImg.onload = () => {
  setupControls();
  loop();
};
</script>

</body>
</html>

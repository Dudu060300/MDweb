<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDweb - Driving Simulator</title>

  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">
</head>

<body>

<!-- ================= NAV ================= -->
<nav>
  <h1>MDweb</h1>

  <div class="user-menu" id="userMenu">
    <div class="user-icon" id="userIcon">U</div>
    <span class="arrow">▼</span>

    <div class="dropdown">
      <span id="userName">Utente</span>
      <a href="profilo.html">Profilo</a>
      <a href="impostazioni.html">Impostazioni</a>
      <a href="#" id="logout">Logout</a>
    </div>
  </div>
</nav>

<!-- ================= GAME ================= -->
<canvas id="gameCanvas" width="400" height="600"></canvas>

<!-- ================= CONTROLS ================= -->
<div class="controls">

  <!-- 🛞 VOLANTE -->
  <div class="steering-wheel" id="wheel">
    <img src="assets/Steering-Wheel.png" draggable="false">
  </div>

  <!-- 🎮 PEDALI -->
  <div class="pedals">
    <button id="gas" class="gas">GAS</button>
    <button id="brake" class="brake">FRENO</button>
  </div>

  <!-- ⚙️ CAMBIO -->
  <div class="gear-box">
    <button onclick="setGear('P')">P</button>
    <button onclick="setGear('D')">D</button>
    <button onclick="setGear('R')">R</button>
  </div>

</div>

<!-- ================= SCRIPT ================= -->
<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 🚗 AUTO
let car = {
  x: 200,
  y: 500,
  angle: 0,
  speed: 0,
  wheelBase: 40
};

// 🅿️ PARCHEGGIO
let parking = {
  x: 160,
  y: 50,
  width: 80,
  height: 120
};

// 🎮 INPUT
let gasPressed = false;
let brakePressed = false;

let steeringAngle = 0;
let steeringInput = 0;

let gear = "D"; // P D R

// ================= CAMBIO =================
function setGear(g) {

  if (g === "P") {
    let inside =
      car.x > parking.x &&
      car.x < parking.x + parking.width &&
      car.y > parking.y &&
      car.y < parking.y + parking.height;

    if (!inside) {
      alert("⚠️ Devi essere nel parcheggio per mettere P!");
      return;
    }
  }

  gear = g;
}

// ================= CONTROLLI =================
function setupControls() {

  const wheel = document.getElementById("wheel");
  const wheelImg = wheel.querySelector("img");

  let dragging = false;
  let centerX = 0;
  let centerY = 0;
  let lastAngle = 0;

  function getAngle(e) {
    return Math.atan2(
      e.clientY - centerY,
      e.clientX - centerX
    ) * 180 / Math.PI;
  }

  wheel.addEventListener("pointerdown", (e) => {
    dragging = true;
    wheel.setPointerCapture(e.pointerId);

    const r = wheel.getBoundingClientRect();
    centerX = r.left + r.width / 2;
    centerY = r.top + r.height / 2;

    lastAngle = getAngle(e);
  });

  wheel.addEventListener("pointermove", (e) => {
    if (!dragging) return;

    let current = getAngle(e);

    let delta = current - lastAngle;

    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    steeringAngle += delta * 2.2;

    steeringAngle = Math.max(-450, Math.min(450, steeringAngle));

    steeringInput = steeringAngle / 450;

    wheelImg.style.transform = `rotate(${steeringAngle}deg)`;

    lastAngle = current;
  });

  wheel.addEventListener("pointerup", () => dragging = false);
  wheel.addEventListener("pointercancel", () => dragging = false);

  // GAS
  document.getElementById("gas").addEventListener("pointerdown", () => gasPressed = true);
  document.getElementById("gas").addEventListener("pointerup", () => gasPressed = false);

  // FRENO
  document.getElementById("brake").addEventListener("pointerdown", () => brakePressed = true);
  document.getElementById("brake").addEventListener("pointerup", () => brakePressed = false);
}

// ================= UPDATE =================
function update() {

  if (gear !== "P") {

    if (gasPressed) {
      if (gear === "D") car.speed += 0.18;
      if (gear === "R") car.speed -= 0.18;
    }

    if (brakePressed) {
      car.speed *= 0.9;
    }

  } else {
    car.speed *= 0.8;
  }

  car.speed *= 0.97;

  let direction = (gear === "R") ? -1 : 1;

  if (Math.abs(car.speed) > 0.1) {
    car.angle += steeringInput * 0.04;
  }

  car.x += Math.cos(car.angle) * car.speed * direction;
  car.y += Math.sin(car.angle) * car.speed * direction;

  // bordi
  if (
    car.x < 0 || car.x > canvas.width ||
    car.y < 0 || car.y > canvas.height
  ) {
    reset();
  }

  // WIN SOLO IN P
  let inside =
    car.x > parking.x &&
    car.x < parking.x + parking.width &&
    car.y > parking.y &&
    car.y < parking.y + parking.height;

  if (inside && gear === "P" && Math.abs(car.speed) < 0.2) {
    alert("🎉 PARCHEGGIO PERFETTO IN P!");
    reset();
  }
}

// ================= RESET =================
function reset() {
  car.x = 200;
  car.y = 500;
  car.speed = 0;
  car.angle = 0;

  steeringAngle = 0;
  steeringInput = 0;

  gear = "D";
}

// ================= DRAW =================
function draw() {

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "green";
  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);
  ctx.fillStyle = "blue";
  ctx.fillRect(-40, -60, 80, 120);
  ctx.restore();
}

// ================= LOOP =================
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

setupControls();
loop();

</script>

</body>
</html>

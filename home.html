<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDweb</title>

  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">

  <style>
    .gear-box button {
      background: #333;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 8px;
      font-weight: bold;
    }

    .gear-box button.active {
      background: #00ff88;
      color: black;
    }
  </style>
</head>

<body>

<nav>
  <h1>MDweb</h1>
</nav>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<div class="controls">

  <div class="steering-wheel" id="wheel">
    <img src="assets/Steering-Wheel.png" draggable="false">
  </div>

  <div class="pedals">
    <button id="gas">GAS</button>
    <button id="brake">FRENO</button>
  </div>

  <div class="gear-box">
    <button id="gearP" onclick="setGear('P')">P</button>
    <button id="gearD" onclick="setGear('D')">D</button>
    <button id="gearR" onclick="setGear('R')">R</button>
  </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// AUTO
let car = {
  x: 200,
  y: 500,
  angle: 0,
  speed: 0
};

// PARCHEGGIO
let parking = {
  x: 160,
  y: 50,
  width: 80,
  height: 120
};

// INPUT
let gasPressed = false;
let brakePressed = false;

let steeringAngle = 0;
let steeringInput = 0;

let gear = "D";

// IMMAGINE AUTO
let carImg = new Image();
carImg.src = "assets/Top-Down-Car-Conceptual-Model-Display-PNG.png";

// CAMBIO
function setGear(g) {

  if (Math.abs(car.speed) > 0.5) {
    alert("⚠️ Fermati prima di cambiare marcia!");
    return;
  }

  if (g === "P") {
    let inside =
      car.x > parking.x &&
      car.x < parking.x + parking.width &&
      car.y > parking.y &&
      car.y < parking.y + parking.height;

    if (!inside) {
      alert("⚠️ Devi essere nel parcheggio per mettere P!");
      return;
    }
  }

  gear = g;

  document.getElementById("gearP").classList.remove("active");
  document.getElementById("gearD").classList.remove("active");
  document.getElementById("gearR").classList.remove("active");

  document.getElementById("gear" + g).classList.add("active");
}

// CONTROLLI
function setupControls() {

  const wheel = document.getElementById("wheel");
  const img = wheel.querySelector("img");

  let dragging = false;
  let cx = 0, cy = 0;
  let last = 0;

  function angle(e) {
    return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
  }

  wheel.addEventListener("pointerdown", (e) => {
    dragging = true;
    wheel.setPointerCapture(e.pointerId);

    const r = wheel.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;

    last = angle(e);
  });

  wheel.addEventListener("pointermove", (e) => {

    if (!dragging) return;

    let current = angle(e);
    let delta = current - last;

    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;

    steeringAngle += delta * 1.5; // 🔥 più preciso

    steeringAngle = Math.max(-450, Math.min(450, steeringAngle));
    steeringInput = steeringAngle / 450;

    img.style.transform = `rotate(${steeringAngle}deg)`;

    last = current;
  });

  wheel.addEventListener("pointerup", () => dragging = false);
  wheel.addEventListener("pointercancel", () => dragging = false);

  document.getElementById("gas").addEventListener("pointerdown", () => gasPressed = true);
  document.getElementById("gas").addEventListener("pointerup", () => gasPressed = false);

  document.getElementById("brake").addEventListener("pointerdown", () => brakePressed = true);
  document.getElementById("brake").addEventListener("pointerup", () => brakePressed = false);
}

// UPDATE
function update() {

  if (gear !== "P") {

    if (gasPressed) {
      car.speed += 0.18;
    }

    if (brakePressed) {
      car.speed *= 0.85;
    }

  } else {
    car.speed *= 0.8;
  }

  car.speed *= 0.97;

  let dir = (gear === "R") ? -1 : 1;

  if (Math.abs(car.speed) > 0.05) {
    car.angle += steeringInput * 0.04;
  }

  // 🔥 MOVIMENTO CORRETTO
  car.x += Math.sin(car.angle) * car.speed * dir;
  car.y -= Math.cos(car.angle) * car.speed * dir;

  // WIN
  let inside =
    car.x > parking.x &&
    car.x < parking.x + parking.width &&
    car.y > parking.y &&
    car.y < parking.y + parking.height;

  if (inside && gear === "P" && Math.abs(car.speed) < 0.2) {
    alert("🎉 PARCHEGGIO PERFETTO!");
    reset();
  }

  // BORDI
  if (
    car.x < 0 || car.x > canvas.width ||
    car.y < 0 || car.y > canvas.height
  ) {
    alert("💥 FUORI!");
    reset();
  }
}

// RESET
function reset() {
  car.x = 200;
  car.y = 500;
  car.speed = 0;
  car.angle = 0;

  steeringAngle = 0;
  steeringInput = 0;

  setGear("D");
}

// DRAW
function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "green";
  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  if (carImg.complete) {
    ctx.drawImage(carImg, -40, -60, 80, 120);
  } else {
    ctx.fillStyle = "red";
    ctx.fillRect(-40, -60, 80, 120);
  }

  ctx.restore();
}

// LOOP
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

setupControls();
setGear("D");
loop();

</script>

</body>
</html>

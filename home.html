<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDweb - Parking Game</title>

  <link rel="stylesheet" href="assets/styleHome.css">
  <link rel="stylesheet" href="assets/css.css">
</head>

<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<!-- 🎮 CONTROLLI -->
<div class="controls">

  <div class="steering-wheel" id="wheel">🚗</div>

  <div class="pedals">
    <button class="gas" id="gas">ACCELERA</button>
    <button class="brake" id="brake">FRENO</button>
  </div>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 🚗 CAR
let car = {
  x: 200,
  y: 500,
  width: 30,
  height: 50,
  angle: 0,
  speed: 0
};

// 🅿️ PARKING
let parking = {
  x: 160,
  y: 50,
  width: 80,
  height: 120
};

// 🎮 INPUT
let keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

let gasPressed = false;
let brakePressed = false;

// 🧭 VOLANTE 900°
let steeringAngle = 0;   // -450 → +450
let steeringInput = 0;

let isGameOver = false;

// 🖼️ AUTO
let carImg = new Image();
carImg.src = "assets/Top-Down-Car-Conceptual-Model-Display-PNG.png";

// 🔧 CONTROLLI GAS / FRENO
function setGas(v){ gasPressed = v; }
function setBrake(v){ brakePressed = v; }

// 🎮 VOLANTE
function setupControls() {

  const wheel = document.getElementById("wheel");

  let dragging = false;
  let lastX = 0;

  function start(x){
    dragging = true;
    lastX = x;
  }

  function move(x){
    if (!dragging) return;

    let delta = x - lastX;
    lastX = x;

    steeringAngle += delta * 1.2;
    steeringAngle = Math.max(-450, Math.min(450, steeringAngle));

    steeringInput = steeringAngle / 450;

    wheel.style.transform = `rotate(${steeringAngle}deg)`;
  }

  function end(){
    dragging = false;
  }

  // 🖱️ mouse
  wheel.addEventListener("mousedown", e => start(e.clientX));
  window.addEventListener("mousemove", e => move(e.clientX));
  window.addEventListener("mouseup", end);

  // 📱 touch
  wheel.addEventListener("touchstart", e => start(e.touches[0].clientX));
  window.addEventListener("touchmove", e => move(e.touches[0].clientX));
  window.addEventListener("touchend", end);

  // gas
  const gas = document.getElementById("gas");
  gas.addEventListener("mousedown", () => setGas(true));
  gas.addEventListener("mouseup", () => setGas(false));
  gas.addEventListener("touchstart", () => setGas(true));
  gas.addEventListener("touchend", () => setGas(false));

  // brake
  const brake = document.getElementById("brake");
  brake.addEventListener("mousedown", () => setBrake(true));
  brake.addEventListener("mouseup", () => setBrake(false));
  brake.addEventListener("touchstart", () => setBrake(true));
  brake.addEventListener("touchend", () => setBrake(false));
}

// 💥 GAME OVER
function gameOver(){
  if (isGameOver) return;
  isGameOver = true;

  alert("💥 HAI PERSO!");
  reset();
}

// 🔄 RESET
function reset(){
  car.x = 200;
  car.y = 500;
  car.speed = 0;
  car.angle = 0;

  steeringAngle = 0;
  steeringInput = 0;

  isGameOver = false;
}

// 🧱 BORDI
function checkBorders(){
  if (
    car.x < 0 ||
    car.x > canvas.width ||
    car.y < 0 ||
    car.y > canvas.height
  ){
    gameOver();
  }
}

// 🅿️ CHECK PARCHEGGIO PRECISO
function checkParkingWin(){

  let centerX = parking.x + parking.width / 2;
  let centerY = parking.y + parking.height / 2;

  let dx = car.x - centerX;
  let dy = car.y - centerY;

  let distance = Math.sqrt(dx*dx + dy*dy);

  let angleOk = Math.abs(car.angle % Math.PI) < 0.25; // quasi dritta
  let speedOk = Math.abs(car.speed) < 0.4;
  let positionOk = distance < 22;

  if (positionOk && angleOk && speedOk){
    win();
  }
}

// 🏆 WIN
function win(){
  alert("🎉 PARCHEGGIO PERFETTO!");
  reset();
}

// 🚗 UPDATE
function update(){

  if (isGameOver) return;

  // accelerazione
  if (gasPressed || keys["ArrowUp"]) car.speed += 0.2;
  if (brakePressed || keys["ArrowDown"]) car.speed -= 0.3;

  // sterzo reale
  car.angle += steeringInput * 0.04;

  // ritorno volante
  steeringAngle *= 0.97;
  steeringInput = steeringAngle / 450;

  // fisica
  car.speed *= 0.98;

  car.x += Math.sin(car.angle) * car.speed;
  car.y -= Math.cos(car.angle) * car.speed;

  checkBorders();
  checkParkingWin();
}

// 🎨 DRAW
function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // parcheggio
  ctx.fillStyle = "green";
  ctx.fillRect(parking.x, parking.y, parking.width, parking.height);

  // auto
  ctx.save();
  ctx.translate(car.x, car.y);
  ctx.rotate(car.angle);

  ctx.drawImage(carImg, -15, -25, car.width, car.height);

  ctx.restore();

  if (isGameOver){
    ctx.fillStyle = "red";
    ctx.font = "30px Arial";
    ctx.fillText("GAME OVER", 90, 300);
  }
}

// LOOP
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// START
carImg.onload = () => {
  setupControls();
  loop();
};
</script>

</body>
</html>
